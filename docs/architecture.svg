<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BQE CORE AI Data Connector architecture</title>
  <desc id="desc">BQE CORE API flows through read-only ingestion and a validated warehouse to AI-assisted planning.</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#d8d0c0" opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" fill="#f7f4ec"/>
  <rect width="1200" height="520" fill="url(#grain)"/>
  <style>
    .eyebrow{font:700 11px Georgia,serif;letter-spacing:1.6px;fill:#173144}
    .headline{font:56px Georgia,serif;fill:#102d3f}
    .body{font:17px Arial,sans-serif;fill:#4a5660}
    .number{font:700 10px Arial,sans-serif;fill:#ff6f1e}
    .stage{font:18px Georgia,serif;fill:#fff}
    .label{font:700 10px Arial,sans-serif;letter-spacing:1.4px;fill:#c85316}
    .detail{font:700 12px Arial,sans-serif;fill:#172732}
  </style>
  <text x="64" y="35" class="eyebrow">BQE CORE AI DATA CONNECTOR</text>
  <circle cx="276" cy="31" r="1.8" fill="#df5f19"/>
  <text x="296" y="35" class="eyebrow">PROFESSIONAL PROJECT · GUTSCHICK, LITTLE &amp; WEBER, P.A.</text>
  <text x="64" y="105" class="headline">An AI-ready bridge from business data</text>
  <text x="64" y="168" class="headline">to decision support.</text>
  <text x="64" y="218" class="body">A governed ingestion layer turns historical BQE CORE operational and financial data into a</text>
  <text x="64" y="244" class="body">normalized, auditable warehouse with traceable project history for planning as workloads change.</text>
  <g transform="translate(64 280)">
    <rect width="252" height="122" fill="#124d43"/>
    <text x="16" y="27" class="number">01</text>
    <text x="16" y="78" class="stage">BQE CORE API</text>
    <circle cx="252" cy="61" r="14" fill="#f7f4ec"/>
    <text x="248" y="66" class="number">→</text>
  </g>
  <g transform="translate(334 280)">
    <rect width="252" height="122" fill="#124d43"/>
    <text x="16" y="27" class="number">02</text>
    <text x="16" y="78" class="stage">Read-only ingestion</text>
    <circle cx="252" cy="61" r="14" fill="#f7f4ec"/>
    <text x="248" y="66" class="number">→</text>
  </g>
  <g transform="translate(604 280)">
    <rect width="252" height="122" fill="#124d43"/>
    <text x="16" y="27" class="number">03</text>
    <text x="16" y="78" class="stage">Validated warehouse</text>
    <circle cx="252" cy="61" r="14" fill="#f7f4ec"/>
    <text x="248" y="66" class="number">→</text>
  </g>
  <g transform="translate(874 280)">
    <rect width="252" height="122" fill="#124d43"/>
    <text x="16" y="27" class="number">04</text>
    <text x="16" y="78" class="stage">AI-assisted planning</text>
  </g>
  <line x1="64" y1="438" x2="1126" y2="438" stroke="#c8c2b7"/>
  <line x1="418" y1="438" x2="418" y2="500" stroke="#c8c2b7"/>
  <line x1="772" y1="438" x2="772" y2="500" stroke="#c8c2b7"/>
  <text x="64" y="463" class="label">ACCESS</text>
  <text x="64" y="487" class="detail">OAuth + PKCE; read:core only</text>
  <text x="434" y="463" class="label">DATA ENGINEERING</text>
  <text x="434" y="487" class="detail">Pagination, retries, deduplication, incremental sync</text>
  <text x="788" y="463" class="label">AI READINESS</text>
  <text x="788" y="487" class="detail">Historical patterns structured for planning and decisions</text>
</svg>
