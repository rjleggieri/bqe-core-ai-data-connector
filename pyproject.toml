[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bqe-core-ai-data-connector"
version = "1.0.0"
description = "Read-only BQE CORE ingestion, validated local warehouse, and AI-ready planning exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bqe = "bqe_reporting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
